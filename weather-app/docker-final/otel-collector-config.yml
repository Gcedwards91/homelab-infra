receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Must run first: refuses data (back-pressure to the SDKs) before the
  # container hits its 256M limit and gets OOM-killed.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50

  # Second layer behind the weather-app request_hook: scrub API keys from any
  # span or span-event attribute (exception messages embed the full URL), so a
  # service that forgets to redact cannot leak a key into Tempo.
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "appid=[^& ]+", "appid=REDACTED")
      - context: spanevent
        statements:
          - replace_all_patterns(attributes, "value", "appid=[^& ]+", "appid=REDACTED")

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp_grpc:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  # Recent collectors bind internal metrics to localhost only; listen on all
  # interfaces so Prometheus can scrape otel-collector:8888.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact, batch]
      exporters: [otlp_grpc]
